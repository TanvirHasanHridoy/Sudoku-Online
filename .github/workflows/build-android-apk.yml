name: Build Android APK (Mobile Experiment)

on:
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab
  push:
    branches:
      - feat/mobile-app-experiment
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile-app/package.json'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Mobile App Dependencies
        run: |
          cd mobile-app
          npm install

      - name: Build Web Production Assets
        run: |
          cd mobile-app
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd mobile-app
          npx cap sync android

      - name: Grant Executable Permissions to Gradlew
        run: chmod +x mobile-app/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd mobile-app/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codoku-sudoku-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
